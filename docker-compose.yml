services:
  website:
    build:
      context: .
      dockerfile: docker/Dockerfile.website
      args:
        NEXT_PUBLIC_WORKFORCE_OS_API_BASE_URL: ${NEXT_PUBLIC_WORKFORCE_OS_API_BASE_URL:-}
    ports:
      - '3000:3000'
    networks:
      - workforce-os

  workforce-console:
    build:
      context: .
      dockerfile: docker/Dockerfile.workforce-console
      args:
        NEXT_PUBLIC_WORKFORCE_OS_API_BASE_URL: ${NEXT_PUBLIC_WORKFORCE_OS_API_BASE_URL:-}
    ports:
      - '3001:80'
    networks:
      - workforce-os

networks:
  workforce-os:
    external: true
    name: workforce-os
