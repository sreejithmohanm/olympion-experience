services:
  website:
    build:
      context: .
      dockerfile: docker/Dockerfile.website
    ports:
      - '3000:3000'
    networks:
      - workforce-os

  workforce-console:
    build:
      context: .
      dockerfile: docker/Dockerfile.workforce-console
    ports:
      - '3001:80'
    networks:
      - workforce-os

networks:
  workforce-os:
    external: true
    name: workforce-os
