server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Proxy auth requests to the identity service
    location /v1/auth/ {
        proxy_pass http://identity-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy catalog, employees, capabilities to the employee registry
    location ~ ^/v1/(catalog|employees|capabilities) {
        proxy_pass http://employee-registry:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Support SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Proxy tenancy routes (customer/org-unit management) to the tenancy service
    location ~ ^/v1/(customers|customer|org-units) {
        proxy_pass http://tenancy-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve static Next.js export
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
